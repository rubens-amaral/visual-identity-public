<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13233D"/>
      <stop offset="100%" stop-color="#0B1628"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7C57A"/>
      <stop offset="100%" stop-color="#C9A44E"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18"/>
    </filter>
  </defs>

  <!-- fundo -->
  <rect x="0" y="0" width="1200" height="280" fill="url(#bg)" rx="16" ry="16"/>

  <!-- elementos decorativos suaves -->
  <circle cx="1050" cy="60" r="90" fill="url(#accent)" opacity="0.14" filter="url(#soft)"/>
  <circle cx="140" cy="220" r="120" fill="url(#accent)" opacity="0.10" filter="url(#soft)"/>

  <!-- moldura -->
  <rect x="10" y="10" width="1180" height="260" fill="none" stroke="url(#accent)" stroke-width="1.6" rx="12" ry="12"/>

  <!-- título -->
  <text x="50%" y="54%" text-anchor="middle"
        font-family="Open Sans, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="700" fill="#E7C57A" letter-spacing="1.2">
    Realm of Achievements
  </text>

  <!-- subtítulo opcional: comente/remova se não quiser -->
  <text x="50%" y="74%" text-anchor="middle"
        font-family="Open Sans, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="600" fill="#B9C7E3" opacity="0.9" letter-spacing="0.5">
    Public Reference — Non-Commercial Use Only
  </text>
</svg>
